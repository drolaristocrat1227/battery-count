<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="バッテリー集計">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<title>バッテリー集計</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", "Meiryo", sans-serif;
    background: #f2f2f5;
    color: #222;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    padding-bottom: env(safe-area-inset-bottom);
  }
  button { font-family: inherit; color: inherit; }

  /* ヘッダー */
  header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: #fff;
    border-bottom: 1px solid #e3e3e8;
    padding: env(safe-area-inset-top) 8px 0;
  }
  .bar {
    display: flex;
    align-items: center;
    height: 52px;
  }
  .bar h1 {
    flex: 1;
    text-align: center;
    font-size: 18px;
    margin: 0;
  }
  .bar button {
    width: 48px;
    height: 44px;
    border: none;
    background: none;
    font-size: 26px;
    color: #e67e22;
  }
  #todayBtn {
    position: absolute;
    right: 56px;
    top: calc(env(safe-area-inset-top) + 12px);
    width: auto;
    height: 28px;
    padding: 0 10px;
    font-size: 13px;
    border: 1px solid #e67e22;
    border-radius: 14px;
  }

  /* 月合計 */
  .sum {
    display: flex;
    margin: 10px 10px 8px;
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
  }
  .sum div {
    flex: 1;
    padding: 10px 14px;
  }
  .sum div + div { border-left: 1px solid #eee; }
  .sum small { display: block; font-size: 12px; color: #888; }
  .sum b { font-size: 26px; }
  .sum .yen b { color: #c0392b; }

  /* カレンダー */
  .cal {
    margin: 0 10px;
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
  }
  .week, .head {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }
  .head div {
    text-align: center;
    font-size: 12px;
    color: #888;
    padding: 6px 0;
  }
  .head .sun { color: #d33; }
  .head .sat { color: #36c; }

  .day {
    height: 54px;
    border-top: 1px solid #f0f0f0;
    padding: 3px 0 0;
    text-align: center;
    position: relative;
  }
  .day .d {
    font-size: 12px;
    display: inline-block;
    min-width: 20px;
    line-height: 20px;
    border-radius: 10px;
  }
  .day.sun .d { color: #d33; }
  .day.sat .d { color: #36c; }
  .day .n {
    font-size: 17px;
    font-weight: bold;
    line-height: 24px;
  }
  .day.other .d, .day.other .n { opacity: .35; }
  .day.today .d { background: #222; color: #fff; }
  .day.sel { background: #fdecd9; }
  .day:active { background: #f6f6f6; }

  .wsum {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    font-size: 12px;
    color: #666;
    background: #faf7f2;
    padding: 4px 10px;
    border-top: 1px solid #f0f0f0;
  }
  .wsum b { color: #222; }
  .wsum .y { color: #c0392b; }

  .note {
    text-align: center;
    font-size: 11px;
    color: #aaa;
    margin: 10px 0 0;
  }
  .foot {
    text-align: center;
    margin: 18px 0 28px;
  }
  #updBtn {
    border: 1px solid #ccc;
    background: #fff;
    border-radius: 18px;
    height: 36px;
    padding: 0 18px;
    font-size: 14px;
    color: #555;
  }
  #updBtn:disabled { opacity: .6; }
  .ver { display: block; font-size: 11px; color: #aaa; margin-top: 6px; }

  /* 入力シート */
  .cover {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.3);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
    z-index: 10;
  }
  .sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: #fff;
    border-radius: 16px 16px 0 0;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform .22s ease-out;
    z-index: 11;
    max-width: 520px;
    margin: 0 auto;
  }
  .open .cover { opacity: 1; pointer-events: auto; }
  .open .sheet { transform: none; }

  .sheet .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #sDate { font-size: 17px; font-weight: bold; }
  #sCur { font-size: 13px; color: #888; margin-left: 6px; font-weight: normal; }
  #closeBtn {
    border: none;
    background: #eee;
    width: 32px;
    height: 32px;
    border-radius: 16px;
    font-size: 16px;
  }

  .seg {
    display: flex;
    background: #eee;
    border-radius: 9px;
    padding: 2px;
    margin: 12px 0 10px;
  }
  .seg button {
    flex: 1;
    border: none;
    background: none;
    height: 34px;
    border-radius: 7px;
    font-size: 15px;
  }
  .seg button.on {
    background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.15);
    font-weight: bold;
  }

  .disp {
    display: flex;
    align-items: baseline;
    justify-content: flex-end;
    gap: 10px;
    height: 48px;
    padding: 0 6px;
    border-bottom: 2px solid #e67e22;
    margin-bottom: 10px;
  }
  #dNum { font-size: 34px; font-weight: bold; }
  #dPrev { font-size: 14px; color: #888; }

  .keys {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .keys button {
    height: 52px;
    border: none;
    border-radius: 10px;
    background: #f2f2f5;
    font-size: 22px;
  }
  .keys button:active { background: #ddd; }
  .keys .sub { font-size: 16px; color: #666; }

  .acts {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }
  .acts button {
    height: 50px;
    border-radius: 10px;
    font-size: 16px;
  }
  #resetBtn {
    flex: 1;
    border: 1px solid #ddd;
    background: #fff;
    color: #c0392b;
  }
  #okBtn {
    flex: 2;
    border: none;
    background: #e67e22;
    color: #fff;
    font-weight: bold;
  }
  #okBtn:disabled { opacity: .4; }
</style>
</head>
<body>

<header>
  <div class="bar">
    <button id="prev">‹</button>
    <h1 id="ym"></h1>
    <button id="next">›</button>
  </div>
  <button id="todayBtn">今日</button>
</header>

<div class="sum">
  <div><small>月合計</small><b id="mCount">0</b> 個</div>
  <div class="yen"><small>金額</small><b id="mYen">¥0</b></div>
</div>

<div class="cal">
  <div class="head">
    <div class="sun">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="sat">土</div>
  </div>
  <div id="weeks"></div>
</div>

<p class="note">1個 ¥165</p>

<div class="foot">
  <button id="updBtn">アプリを更新</button>
  <span class="ver" id="ver"></span>
</div>

<div id="panel">
  <div class="cover" id="cover"></div>
  <div class="sheet">
    <div class="top">
      <div id="sDate"></div>
      <button id="closeBtn">✕</button>
    </div>
    <div class="seg">
      <button data-mode="set">上書き</button>
      <button data-mode="add">追加</button>
    </div>
    <div class="disp">
      <span id="dPrev"></span>
      <span id="dNum">0</span>
    </div>
    <div class="keys">
      <button>1</button><button>2</button><button>3</button>
      <button>4</button><button>5</button><button>6</button>
      <button>7</button><button>8</button><button>9</button>
      <button class="sub" data-k="c">C</button><button>0</button><button class="sub" data-k="bs">⌫</button>
    </div>
    <div class="acts">
      <button id="resetBtn">この日を消す</button>
      <button id="okBtn">決定</button>
    </div>
  </div>
</div>

<script>
const VERSION = '1.2';
const PRICE = 165;
const KEY = 'battery-data';
const WD = ['日', '月', '火', '水', '木', '金', '土'];

let data = {};
try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}

let mode = localStorage.getItem(KEY + '-mode') || 'set';

const today = new Date();
let viewY = today.getFullYear();
let viewM = today.getMonth();
let selKey = null;
let typed = '';

const $ = id => document.getElementById(id);

function pad(n) { return String(n).padStart(2, '0'); }
function toKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function yen(n) { return '¥' + (n * PRICE).toLocaleString(); }
function val(key) { return data[key] || 0; }
function save() { localStorage.setItem(KEY, JSON.stringify(data)); }

function render() {
  $('ym').textContent = viewY + '年' + (viewM + 1) + '月';

  const first = new Date(viewY, viewM, 1);
  const last = new Date(viewY, viewM + 1, 0);
  const d = new Date(viewY, viewM, 1 - first.getDay());
  const todayKey = toKey(today);
  let html = '';
  let monthSum = 0;

  while (d <= last) {
    let weekSum = 0;
    html += '<div class="week">';
    for (let i = 0; i < 7; i++) {
      const key = toKey(d);
      const n = val(key);
      weekSum += n;
      if (d.getMonth() === viewM) monthSum += n;

      let cls = 'day';
      if (i === 0) cls += ' sun';
      if (i === 6) cls += ' sat';
      if (d.getMonth() !== viewM) cls += ' other';
      if (key === todayKey) cls += ' today';
      if (key === selKey) cls += ' sel';
      html += '<div class="' + cls + '" data-key="' + key + '"><span class="d">' + d.getDate() + '</span><div class="n">' + (n || '') + '</div></div>';

      d.setDate(d.getDate() + 1);
    }
    html += '</div>';
    html += '<div class="wsum">週計 <b>' + weekSum + '個</b><span class="y">' + yen(weekSum) + '</span></div>';
  }

  $('weeks').innerHTML = html;
  $('mCount').textContent = monthSum;
  $('mYen').textContent = yen(monthSum);
}

// ---- 入力シート ----

function openSheet(key) {
  selKey = key;
  typed = '';
  const [y, m, d] = key.split('-').map(Number);
  const wd = WD[new Date(y, m - 1, d).getDay()];
  $('sDate').innerHTML = m + '月' + d + '日(' + wd + ')<span id="sCur">現在 ' + val(key) + '個</span>';
  updateDisp();
  document.body.classList.add('open');
  render();
}

function closeSheet() {
  document.body.classList.remove('open');
  selKey = null;
  render();
}

function updateDisp() {
  document.querySelectorAll('.seg button').forEach(b => {
    b.classList.toggle('on', b.dataset.mode === mode);
  });
  const n = typed === '' ? 0 : parseInt(typed, 10);
  $('dNum').textContent = (mode === 'add' ? '+' : '') + n;
  $('dPrev').textContent = mode === 'add' && typed !== '' ? val(selKey) + ' → ' + (val(selKey) + n) : '';
  $('okBtn').disabled = typed === '';
}

function commit() {
  if (typed === '') return;
  const n = parseInt(typed, 10);
  const v = mode === 'add' ? val(selKey) + n : n;
  if (v === 0) delete data[selKey];
  else data[selKey] = v;
  save();
  closeSheet();
}

$('weeks').addEventListener('click', e => {
  const cell = e.target.closest('.day');
  if (cell) openSheet(cell.dataset.key);
});

document.querySelector('.keys').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.k === 'c') typed = '';
  else if (b.dataset.k === 'bs') typed = typed.slice(0, -1);
  else if (typed.length < 5) typed = (typed === '0' ? '' : typed) + b.textContent;
  updateDisp();
});

document.querySelectorAll('.seg button').forEach(b => {
  b.onclick = () => {
    mode = b.dataset.mode;
    localStorage.setItem(KEY + '-mode', mode);
    updateDisp();
  };
});

$('okBtn').onclick = commit;
$('closeBtn').onclick = closeSheet;
$('cover').onclick = closeSheet;

$('resetBtn').onclick = () => {
  if (!data[selKey]) { closeSheet(); return; }
  if (!confirm('この日の数字を消しますか？')) return;
  delete data[selKey];
  save();
  closeSheet();
};

// ---- 月の切り替え ----

function moveMonth(diff) {
  viewM += diff;
  if (viewM < 0) { viewM = 11; viewY--; }
  if (viewM > 11) { viewM = 0; viewY++; }
  render();
}

$('prev').onclick = () => moveMonth(-1);
$('next').onclick = () => moveMonth(1);
$('todayBtn').onclick = () => {
  viewY = today.getFullYear();
  viewM = today.getMonth();
  render();
};

// 左右スワイプでも切り替え
let sx = null, sy = 0;
document.querySelector('.cal').addEventListener('touchstart', e => {
  sx = e.touches[0].clientX;
  sy = e.touches[0].clientY;
}, { passive: true });
document.querySelector('.cal').addEventListener('touchend', e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx;
  const dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) moveMonth(dx < 0 ? 1 : -1);
  sx = null;
});

render();

// ---- 更新 ----

$('ver').textContent = 'ver ' + VERSION;

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

$('updBtn').onclick = async () => {
  const btn = $('updBtn');
  if (!navigator.onLine) {
    alert('通信できません。電波のある所でもう一度押してください。');
    return;
  }
  btn.disabled = true;
  btn.textContent = '更新中…';
  try {
    if ('serviceWorker' in navigator) {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg) await reg.update();
    }
    // 画面のファイルだけ消す。入力した数字(localStorage)は残る
    if (window.caches) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    location.replace(location.pathname + '?v=' + Date.now());
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'アプリを更新';
    alert('更新できませんでした。少し待ってからもう一度押してください。');
  }
};
</script>
</body>
</html>
