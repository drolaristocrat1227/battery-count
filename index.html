<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>バッテリー集計（移転しました）</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", "Meiryo", sans-serif;
    background: #f2f2f5;
    color: #222;
    text-align: center;
    padding: 60px 20px;
  }
  p { line-height: 1.8; }
  a {
    display: inline-block;
    margin-top: 16px;
    background: #e67e22;
    color: #fff;
    text-decoration: none;
    padding: 12px 24px;
    border-radius: 10px;
    font-weight: bold;
  }
</style>
</head>
<body>
<p>バッテリー集計は新しいアドレスに移りました。<br>入力したデータも一緒に移します。</p>
<a id="go" href="https://battery-count.pages.dev/">新しいアドレスを開く</a>

<script>
// github.io に残っているデータを、新アドレスへ URL の # 以降に載せて渡す（# 以降はサーバーに送られない）
const NEW_URL = 'https://battery-count.pages.dev/index.html';

function get(key) {
  try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
}

const payload = {
  data: get('battery-data') || {},
  goals: get('battery-goals') || {},
  daily: localStorage.getItem('battery-daily') || '',
  mode: localStorage.getItem('battery-data-mode') || ''
};
const url = NEW_URL + '#import=' + encodeURIComponent(JSON.stringify(payload));
document.getElementById('go').href = url;

(async () => {
  // 古いオフライン用の仕組みを外す（ほかのアプリの分には触らない）
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs
        .filter(r => r.scope.endsWith('/battery-count/'))
        .map(r => r.unregister()));
    }
    if (window.caches) {
      const keys = await caches.keys();
      await Promise.all(keys.filter(k => k.startsWith('battery-count-')).map(k => caches.delete(k)));
    }
  } catch (e) {}
  location.replace(url);
})();
</script>
</body>
</html>
